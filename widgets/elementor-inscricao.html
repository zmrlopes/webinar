<!--
  Widget de inscrição para o Elementor (widget "HTML").

  Como usar:
  1. Troca APP_URL abaixo pelo domínio real onde publicaste a aplicação
     (ex: "https://o-teu-projeto.vercel.app", sem barra final).
  2. No Elementor, arrasta um widget "HTML" para a página e cola este
     ficheiro inteiro lá dentro.
  3. Mostra sempre a sessão futura mais próxima, sozinho — não precisas de
     atualizar o ID da sessão manualmente sempre que houver uma nova.

  Nada de credenciais aqui dentro: este ficheiro só fala com o teu próprio
  backend (/api/webinars e /api/inscricoes), nunca com a sala Zoom.
-->
<div id="vq-webinar-widget" class="vq-webinar">
  <div class="vq-webinar__carregando">A carregar a próxima sessão...</div>
</div>

<style>
  .vq-webinar {
    max-width: 480px;
    font-family: inherit;
    background: #f7f6f3;
    border: 1px solid #eae7de;
    border-radius: 16px;
    padding: 2rem 1.75rem;
    box-sizing: border-box;
  }
  .vq-webinar__convite {
    background: #f1e6c9;
    color: #4a3c10;
    border: 1px solid #e2cf94;
    border-radius: 999px;
    padding: 0.3rem 0.85rem;
    font-size: 0.85rem;
    margin: 0 0 0.9rem;
  }
  .vq-webinar__kicker {
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 0.75rem;
    font-weight: 700;
    color: #a67c1e;
    margin: 0 0 0.5rem;
  }
  .vq-webinar__titulo {
    font-size: 1.4rem;
    font-weight: 800;
    color: #15130f;
    margin: 0 0 0.25rem;
  }
  .vq-webinar__data {
    color: #6b6a63;
    font-size: 0.9rem;
    margin: 0 0 1rem;
  }
  .vq-webinar label {
    display: block;
    font-weight: 700;
    color: #15130f;
    margin-top: 0.9rem;
    margin-bottom: 0.25rem;
  }
  .vq-webinar input:not([type="checkbox"]) {
    display: block;
    width: 100%;
    box-sizing: border-box;
    padding: 0.6rem 0.8rem;
    border: 1px solid #ddd9cd;
    border-radius: 8px;
    font-size: 1rem;
    background: #fff;
    color: #15130f;
  }
  .vq-webinar input:not([type="checkbox"]):focus {
    outline: none;
    border-color: #b8902f;
    box-shadow: 0 0 0 3px rgba(184, 144, 47, 0.18);
  }
  .vq-webinar label.vq-webinar__consentimento {
    display: flex;
    align-items: flex-start;
    gap: 0.5rem;
    margin-top: 1.25rem;
    font-weight: 400;
    color: #3a382f;
    font-size: 0.88rem;
    line-height: 1.4;
  }
  .vq-webinar__consentimento input {
    width: auto;
    margin-top: 0.2rem;
    accent-color: #b8902f;
  }
  .vq-webinar__consentimento a {
    color: #96731f;
    font-weight: 700;
    text-decoration: underline;
  }
  .vq-webinar button {
    margin-top: 1.25rem;
    width: 100%;
    padding: 0.8rem 1.4rem;
    background: linear-gradient(135deg, #201d18, #000);
    color: #d4af37;
    border: 1px solid #2c2820;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
    box-sizing: border-box;
  }
  .vq-webinar button:hover:not(:disabled) {
    filter: brightness(1.2);
  }
  .vq-webinar button:disabled {
    opacity: 0.6;
    cursor: default;
  }
  .vq-webinar__erro {
    color: #b3261e;
    margin-top: 0.75rem;
  }
  .vq-webinar__sucesso {
    color: #1e7a34;
    font-weight: 600;
  }
</style>

<script>
  (function () {
    var APP_URL = "https://SUBSTITUI-PELO-TEU-DOMINIO.vercel.app";
    var parametrosUrl = new URLSearchParams(window.location.search);
    var referencia = parametrosUrl.get("ref") || undefined;
    var referenciaEmail = parametrosUrl.get("refEmail") || undefined;

    var raiz = document.getElementById("vq-webinar-widget");

    function formatarData(iso) {
      var data = new Date(iso);
      return data.toLocaleString("pt-PT", { dateStyle: "long", timeStyle: "short" });
    }

    function mostrarErroCarregamento() {
      raiz.innerHTML = '<p class="vq-webinar__erro">Não foi possível carregar a próxima sessão. Tenta atualizar a página.</p>';
    }

    function mostrarSemSessoes() {
      raiz.innerHTML = "<p>Não há sessões marcadas de momento.</p>";
    }

    function montarFormulario(webinar) {
      raiz.innerHTML =
        '<p class="vq-webinar__convite" style="display:none"></p>' +
        '<p class="vq-webinar__kicker">Reserva o teu lugar</p>' +
        '<p class="vq-webinar__titulo"></p>' +
        '<p class="vq-webinar__data"></p>' +
        '<form id="vq-webinar-form">' +
        '<label for="vq-nome">Primeiro nome</label>' +
        '<input id="vq-nome" required maxlength="64">' +
        '<label for="vq-apelido">Último nome</label>' +
        '<input id="vq-apelido" required maxlength="64">' +
        '<label for="vq-email">Email</label>' +
        '<input id="vq-email" type="email" required maxlength="254">' +
        '<label for="vq-telemovel">Telemóvel</label>' +
        '<input id="vq-telemovel" type="tel" required maxlength="32">' +
        '<label class="vq-webinar__consentimento" for="vq-consentimento">' +
        '<input id="vq-consentimento" type="checkbox" required>' +
        '<span>Li e aceito a <a href="https://freelancer.viajareviver.net/politica-de-privacidade-2/" target="_blank" rel="noopener noreferrer">Política de Privacidade</a> e autorizo que os meus dados sejam tratados para gerir a inscrição e receber comunicações relacionadas com esta oportunidade.</span>' +
        "</label>" +
        '<button type="submit">Inscrever-me</button>' +
        '<div id="vq-webinar-mensagem"></div>' +
        "</form>";

      raiz.querySelector(".vq-webinar__titulo").textContent = webinar.titulo;
      raiz.querySelector(".vq-webinar__data").textContent =
        formatarData(webinar.comecaEm) + " · " + webinar.duracaoMinutos + " min";

      if (referencia) {
        fetch(APP_URL + "/api/consultor/nome?ref=" + encodeURIComponent(referencia))
          .then(function (resposta) {
            return resposta.json();
          })
          .then(function (dados) {
            if (!dados.nome) return;
            var convite = raiz.querySelector(".vq-webinar__convite");
            convite.textContent = "Convite de ";
            var forte = document.createElement("strong");
            forte.textContent = dados.nome;
            convite.appendChild(forte);
            convite.style.display = "inline-block";
          })
          .catch(function () {});
      }

      if (referenciaEmail) {
        fetch(APP_URL + "/api/consultor/clique", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ webinarId: webinar.id, referenciaEmail: referenciaEmail }),
        }).catch(function () {});
      }

      var form = document.getElementById("vq-webinar-form");
      var mensagem = document.getElementById("vq-webinar-mensagem");
      var botao = form.querySelector("button");

      form.addEventListener("submit", function (evento) {
        evento.preventDefault();
        botao.disabled = true;
        botao.textContent = "A inscrever...";
        mensagem.innerHTML = "";

        fetch(APP_URL + "/api/inscricoes", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            webinarId: webinar.id,
            nome: document.getElementById("vq-nome").value,
            apelido: document.getElementById("vq-apelido").value,
            telemovel: document.getElementById("vq-telemovel").value,
            email: document.getElementById("vq-email").value,
            referencia: referencia,
            referenciaEmail: referenciaEmail,
            consentimentoPrivacidade: document.getElementById("vq-consentimento").checked,
          }),
        })
          .then(function (resposta) {
            return resposta.json().then(function (dados) {
              return { ok: resposta.ok, dados: dados };
            });
          })
          .then(function (resultado) {
            if (!resultado.ok) {
              mensagem.innerHTML =
                '<p class="vq-webinar__erro">' +
                (resultado.dados.erro || "Não foi possível inscrever.") +
                "</p>";
              botao.disabled = false;
              botao.textContent = "Inscrever-me";
              return;
            }
            form.innerHTML =
              '<p class="vq-webinar__sucesso">Inscrição feita! Vais receber um email de confirmação com o link de entrada antes da sessão.</p>';
          })
          .catch(function () {
            mensagem.innerHTML = '<p class="vq-webinar__erro">Falha de ligação — tenta outra vez.</p>';
            botao.disabled = false;
            botao.textContent = "Inscrever-me";
          });
      });
    }

    fetch(APP_URL + "/api/webinars")
      .then(function (resposta) {
        if (!resposta.ok) throw new Error("falha ao carregar sessões");
        return resposta.json();
      })
      .then(function (dados) {
        var webinars = dados.webinars || [];
        if (webinars.length === 0) {
          mostrarSemSessoes();
          return;
        }
        montarFormulario(webinars[0]);
      })
      .catch(mostrarErroCarregamento);
  })();
</script>
